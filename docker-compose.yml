services:
  fornecedores_api:
    build: .
    container_name: fornecedores_api
    ports:
      - "8000:8000"
    environment:
      - RISCO_API_URL=http://risco_api:8001
    depends_on:
      - risco_api
    networks:
      - mvp_network

  risco_api:
    build: ../risco_api
    container_name: risco_api
    ports:
      - "8001:8001"
    networks:
      - mvp_network

networks:
  mvp_network:
    driver: bridge
